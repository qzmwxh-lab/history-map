<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>找回密码 · 拓荒者足迹</title>
  <link rel="stylesheet" href="./admin.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script defer src="./app-config.js"></script>
  <script defer src="./password-recovery.js"></script>
</head>
<body>
  <main class="login-layout">
    <section class="login-story"><span class="eyebrow">HISTORY MAP / ACCOUNT</span><h1>找回访问权限，<br>继续记录历史。</h1><p>通过注册邮箱验证身份。<br>密码重置不会改变账号的管理员权限。</p><a href="./admin.html">← 返回管理员登录</a></section>
    <section class="login-card">
      <form id="recovery-request">
        <span class="eyebrow">账号恢复</span><h2>忘记密码</h2><p class="muted">输入注册邮箱，我们会向邮箱发送重置链接。</p>
        <label>注册邮箱<input id="recovery-email" type="email" autocomplete="username" required maxlength="254"></label>
        <button id="send-recovery" class="primary" type="submit">发送重置邮件</button>
        <p class="footnote">请检查收件箱及垃圾邮件，并使用最新链接。本地预览链接需在运行此项目的电脑上打开。</p>
      </form>
      <form id="recovery-update" hidden>
        <span class="eyebrow">身份已验证</span><h2>设置新密码</h2>
        <label>新密码<input id="new-password" type="password" autocomplete="new-password" minlength="12" required></label>
        <label>确认新密码<input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required></label>
        <p class="footnote">至少 12 个字符，建议使用不重复的长密码。还需满足认证服务的密码策略。</p>
        <button id="update-password" class="primary" type="submit">确认重置密码</button>
      </form>
      <p id="recovery-status" role="status" aria-live="polite" style="margin-top:18px"></p>
      <p id="recovery-error" role="alert" style="color:var(--red);margin-top:12px"></p>
      <p class="footnote"><a href="./admin.html">返回登录</a></p>
    </section>
  </main>
</body>
</html>
